function log(kind,label,emoji="✨",minutes=0,memberId=""){let a={id:uid("a"),kind,label,emoji,minutes:num(minutes),memberId,date:today(),createdAt:new Date().toISOString()};state.activity.unshift(a);state.activity=state.activity.slice(0,500);return a.id}function unlog(kind,label){let i=state.activity.findIndex(a=>a.kind===kind&&a.label===label&&a.date===today());if(i>=0)state.activity.splice(i,1)}function pts(m,b=1){return Math.max(3,Math.round(num(m)*.7*b))}

function score(id){let list=state.tasks.filter(t=>t.roomId===id&&!t.archived);if(!list.length)return 100;let ready=list.filter(t=>t.repeat==="once"?t.done:(t.due||today())>today()||doneToday(t)).length;return Math.round(ready/list.length*100)}
function activeDates(){return[...new Set(state.activity.filter(a=>["task","session","declutter","laundry"].includes(a.kind)).map(a=>a.date))]}function momentum(){let ds=activeDates(),month=today().slice(0,7),active=ds.filter(d=>d.startsWith(month)).length;return{active,total:ds.length}}

function sessionItems(minutes,roomId="all",rescue=false){if(rescue){let src=[["Clear the entrance path",4,"🚪"],["Put visible clutter in one basket",5,"🧺"],["Refresh toilet, sink and hand towel",7,"🛁"],["Wipe the main visible surface",5,"✨"],["Reset kitchen smell and sink",8,"🍋"],["Sweep the main walkway",10,"🧹"],["Lights on, cushions up, breathe",3,"🛋️"]],out=[],used=0;for(let x of src)if(used+x[1]<=minutes||!out.length){out.push({id:uid("q"),title:x[0],minutes:x[1],emoji:x[2],done:false});used+=x[1]}return out}let list=openTasks().filter(t=>roomId==="all"||t.roomId===roomId).sort((a,b)=>(a.impact==="high"?-1:1)-(b.impact==="high"?-1:1)||a.minutes-b.minutes),out=[],used=0;for(let t of list)if(used+num(t.minutes)<=minutes||!out.length){out.push({id:t.id,taskId:t.id,title:t.title,minutes:t.minutes,emoji:room(t.roomId)?.emoji||"✅",done:false});used+=num(t.minutes)}return out}

function timerUI(){if(!timer)return;let c=$("#timerClock"),r=$("#timerRing"),l=$("#sessionList"),b=$("#timerToggle");if(c)c.textContent=clock(timer.left);if(r)r.style.setProperty("--n",(1-timer.left/timer.total)*100+"%");if(b)b.textContent=timer.running?"Pause":"Resume";if(l)l.innerHTML=timer.items.map((x,i)=>`<div class="session-item ${x.done?"done":""}"><span>${x.emoji}</span><strong>${esc(x.title)}</strong><span>${x.minutes}m</span><button class="mini" data-action="session-item" data-index="${i}">${x.done?"✓":"○"}</button></div>`).join("")}
